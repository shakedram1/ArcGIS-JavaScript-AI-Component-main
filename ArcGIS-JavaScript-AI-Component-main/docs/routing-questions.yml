# Routing test set for TA5500 mode (spec §6).
#
# What it checks: that the orchestrator routes each Hebrew request to the expected agent,
# based on the agent descriptions in src/ta5500/prompts.ts (and the other agents' descriptions).
#
# How to run (by hand, after every description change and every @arcgis/* upgrade):
#   1. Start the full dev stack (README "Full Dev Stack"; the RAG must be running for plan entries).
#   2. Open the TA5500 map with ?mode=edit, e.g. http://localhost:5173/?mode=edit .
#      In edit mode the chat shows "Executing registered agent: <name>" for each request. The trace prints
#      the agent's NAME, not its id; map it to the id with the table below. ("Available agents: ..." lists ids.)
#   3. Ask each `q` in a FRESH conversation (press "שיחה חדשה" first), unless the entry has `after:`.
#      An `after:` entry is asked right after the named earlier question, in the same conversation.
#   4. Compare the agent named in the trace with `expect`.
#   5. Record in `result`: pass | fail, and for a fail add `got: <agent id>` (from the name seen) and optionally `note:`.
#      Also record the date and the @arcgis/* version in the line below.
#
# Last run: not run yet (all results pending)
#
# Agent name in the trace → id:
#   "TA5500 Plan"                    → ta5500-plan
#   "TA5500 Map"                     → ta5500-map
#   "Out of scope"                   → ta5500-scope
#   "All Capabilities"               → all-capabilities-agent
#   "Create Feature Layer"           → create-feature-layer-agent
#   "Manage Feature Layer Features"  → manage-feature-layer-agent
#   "Add Layer to Map"               → add-layer-to-map-agent
#   "MCP Hub" (the hub's serverName) → mcp-passthrough-agent
#   SDK built-in data-exploration agent → its name/id is not defined in src/ (the SDK bundle suggests the id
#   "dataExploration"); confirm the actual name and id from the trace on the first run and fix `expect` below.
#
# Fields:
#   q       the request, as typed by the user
#   kind    plan | plan+place | map | out_of_scope | other_agent
#   expect  ta5500-plan | ta5500-map | ta5500-scope | all-capabilities-agent | create-feature-layer-agent |
#           data-exploration (SDK built-in; placeholder until confirmed, see above) | ... (other ids: table above)
#   after   (optional) earlier q this one follows in the same conversation
#   note    what a correct run looks like beyond the agent choice
#   result  pending | pass | fail
#
# Area codes and places below exist in the plan index
# (src/ta5500/__tests__/fixtures/locations.json): 105 אפקה, 202 נאות אפקה, 102/104/106 רמת אביב, 703 מבואות יפו.

# ---- plan questions without a place ----
- q: "מה אומר סעיף 4.3?"
  kind: plan
  expect: ta5500-plan
  note: answer cites only chapter 4 (סעיף 4.x); no place identified, map unchanged
  result: pending
- q: "מהם עקרונות הפיתוח של תעסוקה בתוכנית?"
  kind: plan
  expect: ta5500-plan
  result: pending
- q: "מה מגדירה טבלה 5.4?"
  kind: plan
  expect: ta5500-plan
  result: pending
- q: "מהו רח\"ק ומה הוא קובע בתוכנית המתאר?"
  kind: plan
  expect: ta5500-plan
  result: pending

# ---- plan questions with a place ----
- q: "מה מותר לבנות באזור 105?"
  kind: plan+place
  expect: ta5500-plan
  note: focuses on area 105, highlights relevant plan layers
  result: pending
- q: "אילו נקודות תשתית מתוכננות בנאות אפקה?"
  kind: plan+place
  expect: ta5500-plan
  note: place resolves to area 202
  result: pending
- q: "מה תוכנית הפיתוח העסקי ברמת אביב?"
  kind: plan+place
  expect: ta5500-plan
  result: pending
- q: "מה גובה הבנייה המותר באזור 703?"
  kind: plan+place
  expect: ta5500-plan
  result: pending
- q: "אילו הוראות מיוחדות חלות בתת אזור 101ה?"
  kind: plan+place
  expect: ta5500-plan
  result: pending

# ---- place not in plan index ----
# Area 610 does not exist in the plan index (areas are 101-108, 201-212, 301, 401, 402, ...).
# Expected: the Plan agent answers city-wide from the plan and says "אזור 610 אינו מופיע בתוכנית." (notInPlanNote);
# the code is never sent to the geocoder.
- q: "מה תוכנית הפיתוח העסקי באזור 610?"
  kind: plan+place
  expect: ta5500-plan
  note: place not in plan index; reply includes "אזור 610 אינו מופיע בתוכנית.", no place focus
  result: pending
- q: "מה מותר לבנות באזור 610?"
  kind: plan+place
  expect: ta5500-plan
  note: place not in plan index (same as above)
  result: pending
# real-area twin of the 610 question
- q: "מה תוכנית הפיתוח העסקי באזור 105?"
  kind: plan+place
  expect: ta5500-plan
  note: real area; focus set on 105
  result: pending
- q: "תתמקד על אזור 610"
  kind: map
  expect: ta5500-map
  note: area not in the plan; reply "אזור 610 אינו מופיע בתוכנית.", map unchanged (not geocoded)
  result: pending

# ---- neighbouring cities (inside the bounding box of Tel Aviv-Yafo, outside its planning areas) ----
- q: "קח אותי לרמת גן"
  kind: out_of_scope
  expect: ta5500-scope
  note: ta5500-map declining with OUTSIDE_TA_REPLY is the acceptable alternative (record which); map unchanged
  result: pending
- q: "מה מותר לבנות בגבעתיים?"
  kind: out_of_scope
  expect: ta5500-scope
  note: ta5500-plan declining with OUTSIDE_TA_REPLY is the acceptable alternative (record which); no plan answer, map unchanged
  result: pending

# ---- follow-up / refine / clear focus ----
